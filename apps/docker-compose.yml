x-runtime: &runtime
  image: tiger-perception:local
  build:
    context: ./detect
    args:
      LOCAL_UID: ${LOCAL_UID:?Set LOCAL_UID to your host user ID (id -u)}
      LOCAL_GID: ${LOCAL_GID:?Set LOCAL_GID to your host group ID (id -g)}
  user: "${LOCAL_UID:?Set LOCAL_UID to your host user ID (id -u)}:${LOCAL_GID:?Set LOCAL_GID to your host group ID (id -g)}"
  init: true
  restart: unless-stopped

services:
  detect:
    <<: *runtime
    environment:
      CAMERA_A_RTSP_URL: ${CAMERA_A_RTSP_URL:?Set CAMERA_A_RTSP_URL in apps/.env}
    volumes:
      - type: bind
        source: ../data
        target: /workspace/data
        bind:
          create_host_path: false

  detect-qr:
    <<: *runtime
    command:
      - uv
      - run
      - --no-sync
      - python
      - rtsp_yolo.py
      - --manifest
      - manifests/cell-c-qr.yaml
    environment:
      CAMERA_C_RTSP_URL: ${CAMERA_C_RTSP_URL:?Set CAMERA_C_RTSP_URL in apps/.env}
    volumes:
      - type: bind
        source: ../data
        target: /workspace/data
        bind:
          create_host_path: false

  viewer:
    <<: *runtime
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - tiger_perception.viewer
      - --manifest
      - manifests/cell-a-jeep.yaml
      - --manifest
      - manifests/cell-c-qr.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ../data
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/cells', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3

  publisher:
    <<: *runtime
    restart: "no"
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - tiger_perception.fabric
      - --input
      - /workspace/data/cell-a/jeep-events.jsonl
      - --follow
      - --checkpoint
      - /var/lib/tiger-publisher/delivery.json
      - --live-fabric
    environment:
      FABRIC_EVENTSTREAM_CONNECTION_STRING_FILE: /run/secrets/fabric_connection_string
    secrets:
      - fabric_connection_string
    volumes:
      - type: bind
        source: ../data
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false
      - publisher-state:/var/lib/tiger-publisher

  publisher-qr:
    <<: *runtime
    restart: "no"
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - tiger_perception.fabric
      - --input
      - /workspace/data/cell-c/events.jsonl
      - --follow
      - --checkpoint
      - /var/lib/tiger-publisher/delivery.json
      - --live-fabric
    environment:
      FABRIC_EVENTSTREAM_CONNECTION_STRING_FILE: /run/secrets/fabric_connection_string
    secrets:
      - fabric_connection_string
    volumes:
      - type: bind
        source: ../data
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false
      - publisher-qr-state:/var/lib/tiger-publisher

volumes:
  publisher-state:
  publisher-qr-state:

secrets:
  fabric_connection_string:
    file: ./secrets/fabric-connection-string