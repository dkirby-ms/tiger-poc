[project]
name = "tiger-poc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "opencv-python>=4.10,<5",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "tqdm>=4.70.1",
    "ultralytics>=8.3,<9",
    "PyYAML>=6,<7",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "jsonschema[format]>=4,<5",
]

[project.optional-dependencies]
fabric = [
    "azure-eventhub>=5.12,<6",
    "azure-identity>=1.17,<2",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
