[project]
name = "tiger-poc"
version = "0.1.0"
description = "Ontology-aware edge perception pipeline for Microsoft Fabric"
requires-python = ">=3.11,<3.12"
dependencies = [
    "azure-eventhub>=5.15,<6",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
identity = ["azure-identity>=1.24,<2"]

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "pytest-mock>=3.14,<4",
    "ruff>=0.12,<1",
    "tqdm>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiger_poc"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
